[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smarttraffic-ai"
version = "0.1.0"
description = "Intelligens forgalomelemzés és SUMO jelzőlámpa-összehasonlítás"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7", "traci>=1.24,<2", "sumolib>=1.24,<2", "streamlit>=1.66,<2", "plotly>=6,<7", "Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]
sumo = ["eclipse-sumo>=1.24,<2"]
vision = ["ultralytics>=8.3,<9", "opencv-python>=4.10,<5", "lap>=0.5.12,<1"]
youtube = ["yt-dlp[default]>=2026.10.26"]

[project.scripts]
smarttraffic = "smarttraffic_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sumo: valódi SUMO-integráció", "vision: külön bekapcsolható helyi YOLO-inferencia"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
